
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歴史マスター</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #f1f5f9;
    color: #243247;
    margin: 0;
    padding: 20px;
  }
  main {
    max-width: 650px;
    margin: auto;
  }
  h1 { text-align: center; }
  .panel {
    background: white;
    padding: 22px;
    border-radius: 16px;
    margin-top: 20px;
  }
  button {
    display: block;
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: 1px solid #ccd5e0;
    border-radius: 12px;
    background: white;
    color: #243247;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
  }
  button.selected {
    border: 2px solid #287dca;
    background: #e7f3ff;
  }
  button.primary {
    background: #287dca;
    color: white;
    text-align: center;
    border: none;
  }
  button:disabled { opacity: 0.45; }
  #result { line-height: 1.7; }
</style>
</head>
<body>
<main>
  <h1>📚 歴史マスター</h1>
  <div class="panel">
    <h2 id="era">時代を選ぼう</h2>
    <p id="question">歴史の問題に挑戦！</p>
    <div id="options"></div>
    <button id="action" class="primary"
            onclick="start()">学習を始める</button>
    <div id="result" aria-live="polite"></div>
  </div>
</main>

<script>
const questions = [
  {
    era: "平安時代",
    text: "『源氏物語』の作者は誰？",
    options: [
      "清少納言", "紫式部",
      "小野小町", "推古天皇"
    ],
    answers: [1],
    explanation:
      "紫式部は平安時代の作家で、『源氏物語』を書きました。"
  },
  {
    era: "鎌倉時代",
    text: "鎌倉幕府に関係する人物をすべて選ぼう。",
    options: [
      "源頼朝", "北条政子",
      "徳川家康", "北条義時"
    ],
    answers: [0, 1, 3],
    explanation:
      "源頼朝、北条政子、北条義時は鎌倉幕府と深い関係があります。"
  }
];

let index = 0;
let selected = [];
let answered = false;

function start() {
  index = 0;
  showQuestion();
}

function showQuestion() {
  const q = questions[index];
  selected = [];
  answered = false;

  document.getElementById("era").textContent = q.era;
  document.getElementById("question").textContent = q.text;
  document.getElementById("result").textContent = "";

  const area = document.getElementById("options");
  area.replaceChildren();

  q.options.forEach((option, i) => {
    const button = document.createElement("button");
    button.textContent = option;
    button.onclick = () => {
      if (answered) return;
      if (q.answers.length === 1) {
        selected = [i];
      } else {
        selected = selected.includes(i)
          ? selected.filter(x => x !== i)
          : [...selected, i];
      }
      updateOptions();
    };
    area.appendChild(button);
  });

  const action = document.getElementById("action");
  action.textContent = "答え合わせ";
  action.onclick = checkAnswer;
  action.disabled = true;
}

function updateOptions() {
  document.querySelectorAll("#options button")
    .forEach((button, i) => {
      button.classList.toggle(
        "selected", selected.includes(i)
      );
    });
  document.getElementById("action").disabled =
    selected.length === 0;
}

function checkAnswer() {
  const q = questions[index];
  answered = true;

  const correct =
    selected.length === q.answers.length &&
    selected.every(i => q.answers.includes(i));

  document.getElementById("result").textContent =
    (correct ? "🎉 正解！ " : "もう一度覚えよう！ ") +
    "正解：" +
    q.answers.map(i => q.options[i]).join("、") +
    "。 " + q.explanation;

  const action = document.getElementById("action");
  action.textContent = "次へ";
  action.onclick = () => {
    index++;
    if (index < questions.length) {
      showQuestion();
    } else {
      document.getElementById("era").textContent =
        "学習終了！";
      document.getElementById("question").textContent =
        "2問の体験が終わりました。";
      document.getElementById("options").replaceChildren();
      document.getElementById("result").textContent = "";
      action.textContent = "もう一度遊ぶ";
      action.onclick = start;
    }
  };
}
</script>
</body>
</html>
