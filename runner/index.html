<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef6f1">
  <title>ランナーゲーム</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js"></script>
</head>
<body>
  <main class="runner-app" aria-labelledby="runner-title">
    <header class="runner-header">
      <div>
        <p class="runner-eyebrow">わくわくランナー</p>
        <h1 id="runner-title">ランナーゲーム</h1>
      </div>
      <span id="runner-mode" class="runner-badge" role="status" aria-live="polite">開始前</span>
    </header>

    <dl class="runner-hud" aria-label="ゲームの状況">
      <div><dt>現在の得点</dt><dd><span id="runner-score">0</span><span class="runner-unit">点</span></dd></div>
      <div><dt>残り時間</dt><dd><span id="runner-time">30</span><span class="runner-unit">秒</span></dd></div>
    </dl>

    <section id="runner-viewport" class="runner-viewport" aria-label="ゲーム画面">
      <div id="runner-stage" class="runner-stage">
        <canvas id="runner-canvas" width="960" height="540" role="img"
          aria-label="空と丘を背景にした上下2つの走行レーン。走行中に画面をタップするとキャラクターが反対のレーンへ移動します。">
          このブラウザではゲーム画面を表示できません。Canvasに対応したSafariなどで開いてください。
        </canvas>
      </div>
      <section id="runner-result" class="runner-result" hidden role="status" aria-live="polite" aria-atomic="true" aria-labelledby="runner-result-title">
        <h2 id="runner-result-title"></h2>
        <p id="runner-result-message"></p>
        <p class="runner-result-score">得点 <span id="runner-result-score">0</span>点</p>
      </section>
      <p id="runner-status" class="runner-status" role="status">ゲーム画面を準備しています…</p>
      <noscript><p class="runner-status">ゲーム画面の表示にはJavaScriptを有効にしてください。</p></noscript>
    </section>

    <footer class="runner-footer">
      <p class="runner-help">タップでレーン切替。障害物をよけて30秒走ろう！<br>スター1個で10点。</p>
      <div class="runner-controls" aria-label="走行の開始・一時停止・再開・もう一度">
        <button id="runner-toggle" class="runner-start" type="button" disabled>ゲーム開始</button>
      </div>
    </footer>
  </main>
</body>
</html>
