<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef6f1">
  <title>ランナーゲーム</title>
  <!-- 配信更新時は両方の識別子を揃え、古いCSS・JSとの混在を避ける。 -->
  <link rel="stylesheet" href="./style.css?v=1.7.25">
  <script type="module" src="./game.js?v=1.7.25"></script>
</head>
<body>
  <main class="runner-app" aria-labelledby="runner-title">
    <header class="runner-header">
      <div>
        <p class="runner-eyebrow">わくわくランナー</p>
        <h1 id="runner-title">ランナーゲーム</h1>
      </div>
      <span id="runner-mode" class="runner-badge" role="status" aria-live="polite">開始前</span>
    </header>

    <section id="runner-preview" class="runner-preview" hidden aria-label="ステージ試遊">
      <p class="runner-preview-notice">試遊モード・無料・記録されません</p>
      <div class="runner-stage-choice">
        <label for="runner-stage-select">ステージを選ぶ</label>
        <select id="runner-stage-select" aria-describedby="runner-stage-details runner-stage-help" disabled></select>
      </div>
      <p id="runner-stage-details" aria-live="polite" aria-atomic="true"></p>
      <div class="runner-character-choice">
        <div class="runner-stage-choice">
          <label for="runner-character-select">キャラクターをえらぶ</label>
          <select id="runner-character-select" aria-describedby="runner-character-details runner-stage-help" disabled></select>
        </div>
        <div class="runner-character-summary">
          <img id="runner-character-image" width="48" height="48" alt="">
          <p id="runner-character-details" aria-live="polite" aria-atomic="true"></p>
        </div>
      </div>
      <p id="runner-stage-help">開始前・終了後だけ変更できます。</p>
    </section>

    <dl class="runner-hud" aria-label="ゲームの状況">
      <div><dt>現在の得点</dt><dd><span id="runner-score">0</span><span class="runner-unit">点</span></dd></div>
      <div><dt>進行度</dt><dd><span id="runner-progress">0</span><span class="runner-unit">%</span></dd></div>
    </dl>

    <section id="runner-viewport" class="runner-viewport" aria-label="ゲーム画面">
      <div id="runner-stage" class="runner-stage">
        <div id="runner-lives" class="runner-lives" role="status" aria-live="polite" aria-atomic="true" aria-label="残機2機中あと2機">
          <span id="runner-hearts" aria-hidden="true">♥♥</span>
        </div>
        <canvas id="runner-canvas" width="960" height="540" role="img"
          aria-label="地面を走るしば犬とトゲ岩、乗れる足場、スター、ゴールの旗。走行中にタップするとジャンプします。旗のラインを通過するとクリアです。">
          このブラウザではゲーム画面を表示できません。Canvasに対応したSafariなどで開いてください。
        </canvas>
      </div>
      <section id="runner-result" class="runner-result" hidden role="status" aria-live="polite" aria-atomic="true" aria-labelledby="runner-result-title">
        <h2 id="runner-result-title"></h2>
        <p id="runner-result-message"></p>
        <p class="runner-result-score">得点 <span id="runner-result-score">0</span>点</p>
        <p>到達した進行度 <span id="runner-result-progress">0</span>%</p>
      </section>
      <p id="runner-status" class="runner-status" role="status">ゲーム画面を準備しています…</p>
      <noscript><p class="runner-status">ゲーム画面の表示にはJavaScriptを有効にしてください。</p></noscript>
    </section>

    <footer class="runner-footer">
      <p class="runner-help">ジャンプボタンか画面タップでトゲ岩を飛びこえよう！<br>明るい足場には上から乗れるよ。スター1個で10点。</p>
      <div class="runner-controls" aria-label="ジャンプと走行の開始・一時停止・再開・もう一度">
        <button id="runner-jump" class="runner-jump" type="button" disabled>ジャンプ！</button>
        <button id="runner-toggle" class="runner-start" type="button" disabled>ゲーム開始</button>
      </div>
    </footer>
  </main>
</body>
</html>
